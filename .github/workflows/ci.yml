name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Node tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Frame tools tests (Python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy scipy
          python -m unittest tests/test_frame_tools.py -v
